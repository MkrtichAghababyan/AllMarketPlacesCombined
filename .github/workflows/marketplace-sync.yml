name: Marketplace Sync Automation

on:
  schedule:
    - cron: '0 5 * * *' # 15:00 Yerevan Time
  workflow_dispatch: 

jobs:
  build-and-run:
    runs-on: ubuntu-latest
    
    # This ensures all commands below run INSIDE your project folder
    defaults:
      run:
        working-directory: AllMarketPlacesCombined

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Create Credentials File
        run: |
          # No path needed here because of the 'defaults' setting above
          echo '${{ secrets.GOOGLE_JSON }}' > google-credentials.json

      - name: Run Application
        env:
          SHEET_ID: ${{ secrets.SHEET_ID }}
          SHEET_NAME: ${{ secrets.SHEET_NAME }}
          WB_TOKEN: ${{ secrets.WB_TOKEN }}
          OZON_CLIENT_ID: ${{ secrets.OZON_CLIENT_ID }}
          OZON_API_KEY: ${{ secrets.OZON_API_KEY }}
          YANDEX_TOKEN: ${{ secrets.YANDEX_TOKEN }}
        run: dotnet run

      - name: Upload Sync Log
        if: always() # Run even if the program crashes
        uses: actions/upload-artifact@v4
        with:
          name: marketplace-sync-log
          # Point to the log file inside the project folder
          path: AllMarketPlacesCombined/sync_log.txt
