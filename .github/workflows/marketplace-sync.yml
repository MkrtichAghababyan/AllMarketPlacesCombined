name: Marketplace Sync Automation

on:
  schedule:
    # This is the change: '0 4 * * *' means every day at 4:00 AM UTC
    - cron: '0 11 * * *' 
  workflow_dispatch: # Keeps the manual "Run" button active

jobs:
  build-and-run:
    runs-on: ubuntu-latest
    # This tells EVERY step to start inside your project folder
    defaults:
      run:
        working-directory: ./AllMarketPlacesCombined

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Create Credentials File
        run: |
          # Since we are already in the folder, no path is needed
          echo '${{ secrets.GOOGLE_JSON }}' > google-credentials.json

      - name: Run Application
        env:
          SHEET_ID: ${{ secrets.SHEET_ID }}
          SHEET_NAME: ${{ secrets.SHEET_NAME }}
          WB_TOKEN: ${{ secrets.WB_TOKEN }}
          OZON_CLIENT_ID: ${{ secrets.OZON_CLIENT_ID }}
          OZON_API_KEY: ${{ secrets.OZON_API_KEY }}
          YANDEX_TOKEN: ${{ secrets.YANDEX_TOKEN }}
        # Simple command because we are already in the right place
        run: dotnet run

      - name: Upload Sync Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: marketplace-sync-log
          path: AllMarketPlacesCombined/sync_log.txt
        uses: actions/upload-artifact@v4
        with:
          name: marketplace-sync-log
          path: sync_log.txt
          retention-days: 7 # Keeps the log for 7 days
