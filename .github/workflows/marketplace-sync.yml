name: Marketplace Sync Automation

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]
  schedule:
    - cron: '0 5 * * *' # 09:00 AM Yerevan Time
  workflow_dispatch: 

jobs:
  build-and-run:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: AllMarketPlacesCombined

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Create Credentials File
        run: |
          # Use the strict -d flag and no-newline echo
          echo -n "${{ secrets.GOOGLE_JSON }}" | base64 -d > google-credentials.json
          
      - name: Run Application
        env:
          SHEET_ID: ${{ secrets.SHEET_ID }}
          SHEET_NAME: ${{ secrets.SHEET_NAME }}
          WB_TOKEN: ${{ secrets.WB_TOKEN }}
          OZON_CLIENT_ID: ${{ secrets.OZON_CLIENT_ID }}
          OZON_API_KEY: ${{ secrets.OZON_API_KEY }}
          YANDEX_TOKEN: ${{ secrets.YANDEX_TOKEN }}
        run: dotnet run
